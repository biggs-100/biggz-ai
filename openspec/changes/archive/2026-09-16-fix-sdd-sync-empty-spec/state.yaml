# style of openspec/changes/archive/2026-09-16-fix-false-green-guards/state.yaml. _meta.yaml is left
# untouched as audit-trail history (it still reads phase: explore; this file is the state authority).
phases:
  explore: done
  propose: done
  spec: done
  design: done
  tasks: done
  apply: done
  verify: done
  sync: done
  archive: done
spec_counts:
  requirements: 1
  scenarios: 8
  given_when_then: 8/8/8
  note: >-
    Single domain (sdd), single MODIFIED requirement: Sync Execution Contract, 2 preserved + 6 new
    scenarios. Applied through the canonical sdd.Sync() path (result=applied) into
    openspec/specs/sdd/spec.md: +44/-0 lines; 30 requirements before and after (name-set diff
