discovered_defects:
  - id: ask-check-plain-question-allows
    severity: medium
    where: "cmd/biggz runSddAskCheck / internal/sdd/ask_check.go (payload parsing)"
    detail: >-
      A payload whose question field is NOT JSON (e.g. a plain string) makes biggz sdd-ask-check exit
      0 (allow) instead of 4 (indeterminate). Observed on master by the orchestrator: with a valid
      synthesis and {"question":"Test?","markdown":"<synthesis>"} the command exits 0, so a caller that
      forgets to encode the ask params inside the question string silently bypasses the envelope
      limits, the ownership rule and the substance rule (the synthesis precondition still applies, so
      it is not a total bypass). The correct shape (question = the ask params JSON, as
      biggz-ask-guard.js sends it) behaves as designed (verified: no synthesis -> 1; valid synthesis +
      a thin option -> 3 naming the option). Candidate fix: exit 4 for a question that does not parse
      as JSON, plus a documented example of the payload shape.
    status: recorded; candidate for a bounded follow-up fix (exit-code + docs).
    evidence: >-
      Orchestrator observation on master: {"question":"Test?","markdown":"<synthesis>"} -> exit 0;
      correct-shape probes -> exit 1 (no synthesis) and exit 3 (thin option named). Verify-report
      exercises only the correct shape, so this path slipped both RED/GREEN and verify.
  - id: gh-default-repo-hijack
    severity: medium
    where: "gh CLI resolution in this clone (upstream remote + no default repository)"
    detail: >-
      This clone has an upstream remote pointing at Gentleman-Programming/gentle-pi (since renamed to
      gentle-shell) and no gh default repository set, so bare gh commands resolved to THAT repository
      instead of origin. CORRECTION: this is the real root cause behind the defect recorded as
      gh-pr-create-graphql-quirk in openspec/changes/archive/2026-09-16-fix-sdd-sync-empty-spec/
      state.yaml - the "No commits between master and <branch>" error was gh looking at a repo where
      the branch did not exist, not a graphql quirk nor a phantom PR problem. Mitigated locally with
      gh repo set-default biggs-100/biggz-ai; every gh call in this change pinned --repo
      biggs-100/biggz-ai explicitly. The earlier archive must NOT be edited; this entry supersedes its
      root-cause hypothesis.
    status: recorded; annotate the other archive's entry in a future maintenance pass (do NOT edit archived state.yaml in place).
    evidence: >-
      upstream remote = Gentleman-Programming/gentle-pi (renamed gentle-shell); bare gh issue view 101
      returned an issue from that repository while --repo biggs-100/biggz-ai returned this repo's #101;
      gh repo set-default biggs-100/biggz-ai fixed bare resolution.
  - id: tmp-path-divergence-write-tool-vs-bash
    severity: low
    where: "host write tool vs Git Bash path resolution for /tmp"
    detail: >-
      The host's write tool resolves /tmp to C:\tmp while Git Bash uses
      C:\Users\USER\AppData\Local\Temp, so a file written with one path is invisible to a command run
      with the other. Two sub-agents hit it this session; in the verify run it silently validated a
      STALE report until the divergence was found. Mitigation: keep scratch files inside the repo tree
      or pass explicit Windows paths.
    status: recorded; operational guidance for future phases.
    evidence: >-
      verify-run incident (stale report validated until the divergence was found) + two sub-agent hits
      this session; verified path mapping C:\tmp vs C:\Users\USER\AppData\Local\Temp.
  - id: source-scan-order-assertion-textual
    severity: low
    where: "internal/assets/pi/biggz-ask-guard.test.mjs (call-before-UI assertion)"
    detail: >-
      SUGGESTION from verify: the assertion proving the deployed asset invokes the check before
      rendering is a textual source scan (indexOf('checkCheckpointAsk(') < indexOf('ctx.ui.custom')),
      which a comment could satisfy; a parse-based assertion would harden it. Corroborated meanwhile by
      the import regex, the behavioural guard suite (argv array, no shell, 1000 ms, stdin JSON), and
      source inspection (call at ask-user-choice.ts:79, UI at :102) - residual brittleness only.
      Related traceability nit: design references "A4" with no labeled A1-A6 list in the artifacts.
    status: recorded; candidate for a bounded test-hardening follow-up.
    evidence: >-
      verify-report.md Issues Found / SUGGESTION (1) and (2); source inspection of ask-user-choice.ts
      confirms the real call site precedes ctx.ui.custom.
