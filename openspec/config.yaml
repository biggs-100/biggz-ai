# biggz-ai — SDD Configuration
# Rebuild of gentle-ai from scratch, incorporating architectural lessons.

context: |
  biggz-ai es una reimplementación completa de gentle-ai.
  Go 1.25+ harness (CLI+TUI+MCP): SDD orchestration, review lenses, BigMem SQLite.
  Stack: Go (60K lines), modernc.org/sqlite, Charm Bubbles/Bubbletea/Lipgloss.
  Testing: go test ./... (-short + e2e), coverage -cover, vet/gofmt gates.
  Conventions: Conventional Commits, no Co-Authored-By, 400-line review budget.

strict_tdd: false

testing:
  runner: "go test"
  runner_command: "go test ./... -count=1 -timeout 180s"
  layers:
    unit: true
    integration: true
    e2e: true
  coverage: true
  linter: true
  type_checker: true
  formatter: true

phases:
  proposal:
    required: true
    artifact: openspec/changes/{change}/proposal.md
  spec:
    required: true
    artifact: openspec/changes/{change}/spec.md
  design:
    required: true
    artifact: openspec/changes/{change}/design.md
  tasks:
    required: true
    artifact: openspec/changes/{change}/tasks.md
  apply:
    required: true
    artifact: openspec/changes/{change}/apply-progress.md
  verify:
    required: true
    artifact: openspec/changes/{change}/verify-report.md
  archive:
    required: true
    artifact: openspec/changes/{change}/archive-report.md
