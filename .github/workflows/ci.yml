name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "0 3 * * *"

jobs:
  format:
    name: Go Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Check formatting
        run: |
          set -eo pipefail
          if ! command -v gofmt >/dev/null 2>&1; then
            echo "::error::gofmt is not available on PATH — formatting state unknown, failing closed"
            exit 1
          fi
          if ! unformatted=$(gofmt -l .); then
            echo "::error::gofmt exited non-zero — formatting state unknown, failing closed"
            exit 1
          fi
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi
          echo "All files are properly formatted."

  skill-lint:
    name: Skill Lint
    needs: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node scripts/check-skill-lint.mjs

  provider-contract:
    name: Provider Contract
    needs: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-go@v5
        with: {go-version: stable}
      - run: node scripts/check-provider-contract.mjs
      - run: node scripts/verify-package-files.mjs

  test:
    name: Test (${{ matrix.os }})
    needs: format
    if: always()
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            test_timeout: 180s
          - os: macos-latest
            test_timeout: 180s
          - os: windows-latest
            test_timeout: 300s
    env:
      BIGGZ_TEST_TIMEOUT: ${{ matrix.test_timeout }}
    steps:
      - name: Require successful format
        if: needs.format.result != 'success'
        run: exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          autocrlf: false

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -short skips the e2e suite (it needs the prebuilt binary and runs in
      # its own matrix job below) and a slow store integration test.
      # Windows runners are markedly slower (cold build cache + Defender);
      # the package timeout is 300s on windows, 180s elsewhere.
      - name: Test
        run: go test ./... -short -count=1 -timeout ${{ matrix.test_timeout }}

  complexity:
    name: Complexity
    needs: format
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful format
        if: needs.format.result != 'success'
        run: exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          autocrlf: false

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # CostQuick/ReadOnly: no writes, just checks
      - name: Complexity gate (15/20 diff-aware)
        run: |
          set -eo pipefail
          pinned_cyclo=$(go list -m -f '{{.Version}}' github.com/fzipp/gocyclo 2>/dev/null || echo "")
          pinned_cognit=$(go list -m -f '{{.Version}}' github.com/uudashr/gocognit 2>/dev/null || echo "")
          echo "Pinned gocyclo $pinned_cyclo, gocognit $pinned_cognit"
          if [ -z "$pinned_cyclo" ] || [ -z "$pinned_cognit" ]; then
            echo "::warning::Complexity tools not pinned in go.mod"
          fi
          # Drift check: compare expected vs actual resolved via go list
          actual_cyclo=$(go list -m github.com/fzipp/gocyclo 2>/dev/null | awk '{print $2}' || echo "")
          actual_cognit=$(go list -m github.com/uudashr/gocognit 2>/dev/null | awk '{print $2}' || echo "")
          if [ "$pinned_cyclo" != "$actual_cyclo" ]; then
            echo "::warning::gocyclo version drift: expected $pinned_cyclo vs actual $actual_cyclo"
          fi
          if [ "$pinned_cognit" != "$actual_cognit" ]; then
            echo "::warning::gocognit version drift: expected $pinned_cognit vs actual $actual_cognit"
          fi
          base=""
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base=$(git merge-base HEAD origin/main 2>/dev/null || git merge-base HEAD origin/master 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || echo "")
          fi
          if [ -z "$base" ]; then
            echo "warning: could not determine base, using HEAD"
            base="HEAD"
          fi
          echo "Base: $base Head: $(git rev-parse HEAD)"
          if ! git diff --name-only "$base"...HEAD -- internal/review internal/sdd internal/verification > /tmp/changed_files.txt 2>/dev/null; then
            echo "::error::git diff against $base failed — cannot scope the complexity gate, failing closed"
            exit 1
          fi
          cat /tmp/changed_files.txt
          # Producers are scoped to the diff and their own exit status is the
          # verdict: gocyclo/gocognit exit 1 when a target exceeds the
          # threshold, so `-over` is never masked with `|| true`. A
          # zero-function scan while the diff changes in-scope files fails.
          blocking_files=""
          test_files=""
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            [ -f "$f" ] || continue
            case "$f" in
              *_test.go) test_files="$test_files $f" ;;
              *) blocking_files="$blocking_files $f" ;;
            esac
          done < /tmp/changed_files.txt
          echo "Changed blocking files:$blocking_files"
          echo "Changed test files (informational):$test_files"
          if git diff --name-status "$base"...HEAD 2>/dev/null | grep -q "^R"; then
            echo "::warning::File rename detected where git diff reports no mappable function hunks — not blocking"
          fi
          fail=0
          cyclo_evaluated=0
          cognit_evaluated=0
          if [ -n "$blocking_files" ]; then
            echo "Running gocyclo over changed blocking files (producer exit status is the verdict)..."
            cyclo_rc=0
            cyclo_out=$(go run github.com/fzipp/gocyclo/cmd/gocyclo -over 15 $blocking_files 2>&1) || cyclo_rc=$?
            echo "$cyclo_out"
            if [ "$cyclo_rc" -ne 0 ]; then
              echo "::error::gocyclo exited $cyclo_rc on changed files (violation >15, parse error, or tool failure):"
              fail=1
            fi
            echo "Running gocognit over changed blocking files (producer exit status is the verdict)..."
            cognit_rc=0
            cognit_out=$(go run github.com/uudashr/gocognit/cmd/gocognit -over 20 $blocking_files 2>&1) || cognit_rc=$?
            echo "$cognit_out"
            if [ "$cognit_rc" -ne 0 ]; then
              echo "::error::gocognit exited $cognit_rc on changed files (violation >20, parse error, or tool failure):"
              fail=1
            fi
            # Census: prove both producers evaluated functions from the diff.
            census_rc=0
            census_cyclo=$(go run github.com/fzipp/gocyclo/cmd/gocyclo -over 0 $blocking_files 2>&1) || census_rc=$?
            if [ "$census_rc" -ne 0 ]; then
              echo "::error::gocyclo census run failed (exit $census_rc) — complexity state unknown, failing closed"
              exit 1
            fi
            if [ -n "$census_cyclo" ]; then
              cyclo_evaluated=$(printf '%s\n' "$census_cyclo" | wc -l | tr -d ' ')
            fi
            census_rc=0
            census_cognit=$(go run github.com/uudashr/gocognit/cmd/gocognit -over 0 $blocking_files 2>&1) || census_rc=$?
            if [ "$census_rc" -ne 0 ]; then
              echo "::error::gocognit census run failed (exit $census_rc) — complexity state unknown, failing closed"
              exit 1
            fi
            if [ -n "$census_cognit" ]; then
              cognit_evaluated=$(printf '%s\n' "$census_cognit" | wc -l | tr -d ' ')
            fi
            if [ "$cyclo_evaluated" -eq 0 ] || [ "$cognit_evaluated" -eq 0 ]; then
              echo "::error::producer evaluated zero functions while the diff modifies in-scope Go files — an empty scan is not a clean tree"
              exit 1
            fi
          else
            echo "No changed blocking files, skipping gate check (legacy/test/rename warn)"
          fi
          if [ -n "$test_files" ]; then
            # Test-file findings stay informational; their exit status never blocks.
            test_rc=0
            test_cyclo=$(go run github.com/fzipp/gocyclo/cmd/gocyclo -over 15 $test_files 2>&1) || test_rc=$?
            test_cognit=$(go run github.com/uudashr/gocognit/cmd/gocognit -over 20 $test_files 2>&1) || test_rc=$?
            if [ -n "$test_cyclo" ] || [ -n "$test_cognit" ]; then
              echo "::warning::Informational test file violations (never block):"
              echo "$test_cyclo"
              echo "$test_cognit"
            fi
          fi
          echo "Complexity scan: cyclomatic evaluated $cyclo_evaluated, cognitive evaluated $cognit_evaluated (changed blocking files)"
          if [ "$fail" -eq 1 ]; then
            echo "Complexity gate failed: new/modified functions exceed 15/20 in critical packages"
            exit 1
          fi
          echo "Complexity gate passed"

  forbid-git:
    name: Forbid Git Exec Outside Wrapper
    needs: format
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful format
        if: needs.format.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          autocrlf: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Forbid git spawns outside internal/git (compiled gitexec checker)
        run: |
          # The checker is built from this repository and run bare: a build
          # failure fails the step, and there is no pipeline, no `2>/dev/null`,
          # and no absence check that could print a pass verdict for it.
          go build -o /tmp/gitexec ./tools/gitexec/cmd/gitexec && /tmp/gitexec -root .

  no-fmtSprintf:
    name: No fmt.Sprintf in lens prompts
    needs: format
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful format
        if: needs.format.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          autocrlf: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: No fmt.Sprintf in lens files without allowlist (Go guard test)
        run: go test ./internal/review/lens/ -run 'TestCIGuard_' -count=1

  lint-no-source-grep:
    name: Lint No Source-Grep
    needs: format
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful format
        if: needs.format.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          autocrlf: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Build nosourcegrep vet tool
        run: go build -o /tmp/nosourcegrep ./tools/nosourcegrep/cmd/nosourcegrep
      - name: Run nosourcegrep vet (primary, observed exit status)
        run: |
          # pipefail: without it the pipeline reports tee's status, so a real
          # analyzer violation would print "nosourcegrep vet passed".
          set -eo pipefail
          echo "Running go vet -vettool nosourcegrep..."
          if ! go vet -vettool=/tmp/nosourcegrep ./... 2>&1 | tee /tmp/vet.log; then
            echo "::error::nosourcegrep vet flagged source-grep"
            cat /tmp/vet.log
            exit 1
          fi
          echo "nosourcegrep vet passed"
          # The analyzer's own code path covers both former fallback domains
          # (tools/nosourcegrep/analyzer.go): os.ReadFile on source + Contains,
          # expect(...).ToContain/literals, and mock.module calls, selectors and
          # string literals — so the weaker duplicate `rg` steps were removed.
          # Optional golangci-lint custom (plugin not supported on all platforms, non-blocking if missing)
          if command -v golangci-lint >/dev/null 2>&1; then
            echo "Attempting golangci-lint run (custom nosourcegrep)..."
            golangci-lint run ./... 2>&1 | tee /tmp/golint.log || echo "::warning::golangci-lint custom nosourcegrep not available (plugin not implemented on this runner)"
          fi

  rapid:
    name: TestRapid
    needs: format
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful format
        if: needs.format.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          autocrlf: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: TestRapid
        run: go test -run TestRapid ./... -count=1 -timeout 180s

  e2e:
    name: E2E (${{ matrix.os }})
    needs: format
    if: always()
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Require successful format
        if: needs.format.result != 'success'
        run: exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          autocrlf: false

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # biggz.exe is the discovery name the e2e suite probes on every OS;
      # -o biggz.exe keeps the three matrix legs byte-identical.
      - name: Build
        run: go build -o biggz.exe ./cmd/biggz

      - name: Run E2E tests
        run: go test ./e2e/... -count=1 -timeout 10m -v

  release-checksums:
    name: Release Checksums Smoke
    needs: format
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful format
        if: needs.format.result != 'success'
        run: exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          autocrlf: false

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6.4.0 # e435ccd777264be153ace6237001ef4d979d3a7a
        with:
          distribution: goreleaser
          version: v2.18.1
          install-only: true

      - name: Install minisign
        run: |
          sudo apt-get update && sudo apt-get install -y minisign
          minisign -V || true

      - name: Generate throwaway minisign key
        run: |
          mkdir -p /tmp
          minisign -G -W -f -p /tmp/minisign.pub -s /tmp/minisign.key
          chmod 600 /tmp/minisign.key || true
          ls -lh /tmp/minisign.*

      - name: Go vet (CGO_ENABLED=0)
        env:
          CGO_ENABLED: 0
        run: go vet ./...

      - name: GoReleaser snapshot release
        env:
          CGO_ENABLED: 0
        run: goreleaser release --snapshot --clean

      - name: "Assert exactly 5 targets (10 archives: 5 tar.gz + 5 zip)"
        run: |
          set -e
          echo "Checking dist/ contents"
          ls -R dist | head -n 200
          tar_count=$(ls dist/*.tar.gz 2>/dev/null | wc -l)
          zip_count=$(ls dist/*.zip 2>/dev/null | wc -l)
          archive_count=$(ls dist/*.tar.gz dist/*.zip 2>/dev/null | wc -l)
          echo "tar.gz: $tar_count zip: $zip_count total: $archive_count"
          if [ "$tar_count" -ne 5 ] || [ "$zip_count" -ne 5 ]; then
            echo "::error::Expected 5 tar.gz and 5 zip (10 total) for 5 LEAF_TARGETS, got $tar_count tar.gz and $zip_count zip"
            ls -1 dist/
            exit 1
          fi
          if ls dist/*windows_arm64* 1>/dev/null 2>&1; then
            echo "::error::windows/arm64 archive found but must be excluded"
            exit 1
          fi
          echo "5 LEAF_TARGETS verified (5 tar.gz + 5 zip), windows/arm64 excluded"

      - name: Verify checksums and minisign
        run: |
          set -e
          ls -lh dist/checksums.txt dist/checksums.txt.minisig
          echo "--- sha256sum -c ---"
          (cd dist && sha256sum -c checksums.txt)
          echo "--- minisign verify (throwaway key) ---"
          minisign -Vm dist/checksums.txt -p /tmp/minisign.pub -x dist/checksums.txt.minisig
          echo "Smoke minisign verification passed"

      - name: Verify BuildVersion
        run: |
          set -e
          bin=$(find dist -type f -path "*linux_amd64*" -name "biggz" | head -n 1)
          if [ -z "$bin" ]; then bin=$(find dist -type f -path "*linux*" -name "biggz" | head -n 1); fi
          if [ -z "$bin" ]; then bin=$(find dist -type f -name "biggz" | head -n 1); fi
          echo "Found binary: $bin"
          if [ -z "$bin" ]; then
            archive=$(ls dist/*linux*.tar.gz 2>/dev/null | head -n 1)
            if [ -z "$archive" ]; then archive=$(ls dist/*.tar.gz | head -n 1); fi
            echo "No binary found, extracting $archive"
            mkdir -p /tmp/biggz-smoke
            tar -xzf "$archive" -C /tmp/biggz-smoke
            bin=$(find /tmp/biggz-smoke -name "biggz*" -type f | head -n 1)
            echo "Extracted binary: $bin"
          fi
          if [ -z "$bin" ]; then
            echo "::error::Could not locate biggz binary"
            exit 1
          fi
          chmod +x "$bin" || true
          echo "Running $bin --version"
          "$bin" --version
          ver=$("$bin" --version)
          echo "Version output: $ver"
          if [ -z "$ver" ]; then
            echo "::error::--version output empty"
            exit 1
          fi
          echo "BuildVersion check passed"
