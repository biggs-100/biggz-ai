name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "0 3 * * *"

jobs:
  format:
    name: Go Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi
          echo "All files are properly formatted."

  test:
    name: Test (${{ matrix.os }})
    needs: format
    if: always()
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Require successful format
        if: needs.format.result != 'success'
        run: exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          autocrlf: false

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -short skips the e2e suite (it needs the prebuilt binary and runs in
      # its own matrix job below) and a slow store integration test.
      - name: Test
        run: go test ./... -short -count=1 -timeout 180s

  e2e:
    name: E2E (${{ matrix.os }})
    needs: format
    if: always()
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Require successful format
        if: needs.format.result != 'success'
        run: exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          autocrlf: false

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # biggz.exe is the discovery name the e2e suite probes on every OS;
      # -o biggz.exe keeps the three matrix legs byte-identical.
      - name: Build
        run: go build -o biggz.exe ./cmd/biggz

      - name: Run E2E tests
        run: go test ./e2e/... -count=1 -timeout 10m -v
