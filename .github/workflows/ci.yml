name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "0 3 * * *"

jobs:
  format:
    name: Go Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi
          echo "All files are properly formatted."

  skill-lint:
    name: Skill Lint
    needs: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node scripts/check-skill-lint.mjs

  provider-contract:
    name: Provider Contract
    needs: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-go@v5
        with: {go-version: stable}
      - run: node scripts/check-provider-contract.mjs
      - run: node scripts/verify-package-files.mjs

  test:
    name: Test (${{ matrix.os }})
    needs: format
    if: always()
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Require successful format
        if: needs.format.result != 'success'
        run: exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          autocrlf: false

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -short skips the e2e suite (it needs the prebuilt binary and runs in
      # its own matrix job below) and a slow store integration test.
      - name: Test
        run: go test ./... -short -count=1 -timeout 180s

  complexity:
    name: Complexity
    needs: format
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful format
        if: needs.format.result != 'success'
        run: exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          autocrlf: false

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # CostQuick/ReadOnly: no writes, just checks
      - name: Complexity gate (15/20 diff-aware)
        run: |
          set -e
          pinned_cyclo=$(go list -m -f '{{.Version}}' github.com/fzipp/gocyclo 2>/dev/null || echo "")
          pinned_cognit=$(go list -m -f '{{.Version}}' github.com/uudashr/gocognit 2>/dev/null || echo "")
          echo "Pinned gocyclo $pinned_cyclo, gocognit $pinned_cognit"
          if [ -z "$pinned_cyclo" ] || [ -z "$pinned_cognit" ]; then
            echo "::warning::Complexity tools not pinned in go.mod"
          fi
          # Drift check: compare expected vs actual resolved via go list
          actual_cyclo=$(go list -m github.com/fzipp/gocyclo 2>/dev/null | awk '{print $2}' || echo "")
          actual_cognit=$(go list -m github.com/uudashr/gocognit 2>/dev/null | awk '{print $2}' || echo "")
          if [ "$pinned_cyclo" != "$actual_cyclo" ]; then
            echo "::warning::gocyclo version drift: expected $pinned_cyclo vs actual $actual_cyclo"
          fi
          if [ "$pinned_cognit" != "$actual_cognit" ]; then
            echo "::warning::gocognit version drift: expected $pinned_cognit vs actual $actual_cognit"
          fi
          base=""
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base=$(git merge-base HEAD origin/main 2>/dev/null || git merge-base HEAD origin/master 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || echo "")
          fi
          if [ -z "$base" ]; then
            echo "warning: could not determine base, using HEAD"
            base="HEAD"
          fi
          echo "Base: $base Head: $(git rev-parse HEAD)"
          git diff --name-only "$base"...HEAD -- internal/review internal/sdd internal/verification > /tmp/changed_files.txt 2>/dev/null || true
          cat /tmp/changed_files.txt || true
          grep -v "_test.go" /tmp/changed_files.txt > /tmp/changed_blocking.txt 2>/dev/null || true
          echo "Changed blocking files:"
          cat /tmp/changed_blocking.txt || echo "(none)"
          echo "Running gocyclo..."
          cyclo_out=$(go run github.com/fzipp/gocyclo/cmd/gocyclo -over 15 ./internal/review ./internal/sdd ./internal/verification 2>&1 || true)
          echo "$cyclo_out"
          echo "Running gocognit..."
          cognit_out=$(go run github.com/uudashr/gocognit/cmd/gocognit -over 20 ./internal/review ./internal/sdd ./internal/verification 2>&1 || true)
          echo "$cognit_out"
          if git diff --name-status "$base"...HEAD 2>/dev/null | grep -q "^R"; then
            echo "::warning::File rename detected where git diff reports no mappable function hunks — not blocking"
          fi
          fail=0
          cyclo_filtered=""
          cognit_filtered=""
          if [ -s /tmp/changed_blocking.txt ]; then
            for f in $(cat /tmp/changed_blocking.txt); do
              nf=$(echo "$f" | sed 's|^\./||')
              m=$(echo "$cyclo_out" | grep -F "$nf" || true)
              if [ -n "$m" ]; then cyclo_filtered="$cyclo_filtered$m\n"; fi
              m2=$(echo "$cognit_out" | grep -F "$nf" || true)
              if [ -n "$m2" ]; then cognit_filtered="$cognit_filtered$m2\n"; fi
            done
          else
            echo "No changed blocking files, skipping gate check (legacy/test/rename warn)"
          fi
          test_cyclo=$(echo "$cyclo_out" | grep "_test.go" || true)
          test_cognit=$(echo "$cognit_out" | grep "_test.go" || true)
          if [ -n "$test_cyclo" ] || [ -n "$test_cognit" ]; then
            echo "::warning::Informational test file violations (never block):"
            echo "$test_cyclo"
            echo "$test_cognit"
          fi
          if [ -n "$cyclo_filtered" ]; then
            echo "::error::Cyclomatic violations in changed files (>15):"
            echo -e "$cyclo_filtered"
            fail=1
          fi
          if [ -n "$cognit_filtered" ]; then
            echo "::error::Cognitive violations in changed files (>20):"
            echo -e "$cognit_filtered"
            fail=1
          fi
          if [ -n "$cyclo_out" ] || [ -n "$cognit_out" ]; then
            echo "Complexity debt: cyclomatic $(echo "$cyclo_out" | grep -c . || echo 0), cognitive $(echo "$cognit_out" | grep -c . || echo 0)"
          fi
          if [ "$fail" -eq 1 ]; then
            echo "Complexity gate failed: new/modified functions exceed 15/20 in critical packages"
            exit 1
          fi
          echo "Complexity gate passed"

  forbid-git:
    name: Forbid Git Exec Outside Wrapper
    needs: format
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful format
        if: needs.format.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          autocrlf: false
      - name: Forbid exec.Command git outside internal/git
        run: |
          set -e
          # tui-sanitize: internal/git is sole exec.Command("git") owner.
          # Hard-fail if any Go file outside internal/git contains exec.Command with git.
          # Allowlist: internal/git/** and test files (*_test.go); e2e and openspec are excluded as fixtures/docs.
          echo "Checking for forbidden exec.Command git outside internal/git (global)..."
          if rg -n 'exec\.Command.*git' --glob '!internal/git/**' --glob '!*_test.go' --glob '!e2e/**' --glob '!openspec/**' . 2>/dev/null | grep -q .; then
            echo "::error::Forbidden exec.Command git found outside internal/git:"
            rg -n 'exec\.Command.*git' --glob '!internal/git/**' --glob '!*_test.go' --glob '!e2e/**' --glob '!openspec/**' . || true
            exit 1
          fi
          echo "No forbidden git exec found outside internal/git."

  no-fmtSprintf:
    name: No fmt.Sprintf in lens prompts
    needs: format
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful format
        if: needs.format.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          autocrlf: false
      - name: No fmt.Sprintf in lens prompts
        run: |
          set -e
          echo "Checking for prompt fmt.Sprintf in internal/review/lens (allowlist //lint:ignore no-fmtSprintf)..."
          if rg -n 'fmt\.Sprintf' internal/review/lens --glob '!*_test.go' 2>/dev/null | grep -v '//lint:ignore no-fmtSprintf' | grep -q .; then
            echo "::error::Prompt fmt.Sprintf found without allowlist in internal/review/lens:"
            rg -n 'fmt\.Sprintf' internal/review/lens --glob '!*_test.go' | grep -v '//lint:ignore no-fmtSprintf' || true
            exit 1
          fi
          echo "No prompt fmt.Sprintf found — guard passed."

  lint-no-source-grep:
    name: Lint No Source-Grep
    needs: format
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful format
        if: needs.format.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          autocrlf: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Build nosourcegrep vet tool
        run: go build -o /tmp/nosourcegrep ./tools/nosourcegrep/cmd/nosourcegrep
      - name: Run nosourcegrep vet (primary)
        run: |
          set -e
          echo "Running go vet -vettool nosourcegrep..."
          if ! go vet -vettool=/tmp/nosourcegrep ./... 2>&1 | tee /tmp/vet.log; then
            echo "::error::nosourcegrep vet flagged source-grep"
            cat /tmp/vet.log
            exit 1
          fi
          echo "nosourcegrep vet passed"
          # Optional golangci-lint custom (plugin not supported on all platforms, non-blocking if missing)
          if command -v golangci-lint >/dev/null 2>&1; then
            echo "Attempting golangci-lint run (custom nosourcegrep)..."
            golangci-lint run ./... 2>&1 | tee /tmp/golint.log || echo "::warning::golangci-lint custom nosourcegrep not available (plugin not implemented on this runner)"
          fi
      - name: Fallback rg guard for source-grep
        run: |
          set -e
          echo "Checking rg fallback for source-grep..."
          if rg -n "os\.ReadFile.*Contains|expect\(src\)" --glob '*_test.go' . 2>/dev/null | grep -v "tools/nosourcegrep/testdata" | grep -v "internal/extension/shim_test.go" | grep -q .; then
            echo "::error::rg fallback flagged source-grep:"
            rg -n "os\.ReadFile.*Contains|expect\(src\)" --glob '*_test.go' . | grep -v "tools/nosourcegrep/testdata" | grep -v "internal/extension/shim_test.go" || true
            exit 1
          fi
          echo "rg source-grep check passed"
      - name: Ban mock.module (oven-sh/bun#12823)
        run: |
          set -e
          echo "Checking for mock.module..."
          if rg -n "mock\.module" --glob '*_test.go' . 2>/dev/null | grep -q .; then
            echo "::error::mock.module found (banned per oven-sh/bun#12823):"
            rg -n "mock\.module" --glob '*_test.go' . || true
            exit 1
          fi
          echo "No mock.module found — guard passed."

  rapid:
    name: TestRapid
    needs: format
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful format
        if: needs.format.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          autocrlf: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: TestRapid
        run: go test -run TestRapid ./... -count=1 -timeout 180s

  e2e:
    name: E2E (${{ matrix.os }})
    needs: format
    if: always()
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Require successful format
        if: needs.format.result != 'success'
        run: exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          autocrlf: false

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # biggz.exe is the discovery name the e2e suite probes on every OS;
      # -o biggz.exe keeps the three matrix legs byte-identical.
      - name: Build
        run: go build -o biggz.exe ./cmd/biggz

      - name: Run E2E tests
        run: go test ./e2e/... -count=1 -timeout 10m -v

  release-checksums:
    name: Release Checksums Smoke
    needs: format
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful format
        if: needs.format.result != 'success'
        run: exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          autocrlf: false

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          install-only: true

      - name: Install minisign
        run: |
          sudo apt-get update && sudo apt-get install -y minisign
          minisign -V || true

      - name: Generate throwaway minisign key
        run: |
          mkdir -p /tmp
          minisign -G -W -f -p /tmp/minisign.pub -s /tmp/minisign.key
          chmod 600 /tmp/minisign.key || true
          ls -lh /tmp/minisign.*

      - name: Go vet (CGO_ENABLED=0)
        env:
          CGO_ENABLED: 0
        run: go vet ./...

      - name: GoReleaser snapshot release
        env:
          CGO_ENABLED: 0
        run: goreleaser release --snapshot --clean

      - name: Assert exactly 5 targets (10 archives: 5 tar.gz + 5 zip)
        run: |
          set -e
          echo "Checking dist/ contents"
          ls -R dist | head -n 200
          tar_count=$(ls dist/*.tar.gz 2>/dev/null | wc -l)
          zip_count=$(ls dist/*.zip 2>/dev/null | wc -l)
          archive_count=$(ls dist/*.tar.gz dist/*.zip 2>/dev/null | wc -l)
          echo "tar.gz: $tar_count zip: $zip_count total: $archive_count"
          if [ "$tar_count" -ne 5 ] || [ "$zip_count" -ne 5 ]; then
            echo "::error::Expected 5 tar.gz and 5 zip (10 total) for 5 LEAF_TARGETS, got $tar_count tar.gz and $zip_count zip"
            ls -1 dist/
            exit 1
          fi
          if ls dist/*windows_arm64* 1>/dev/null 2>&1; then
            echo "::error::windows/arm64 archive found but must be excluded"
            exit 1
          fi
          echo "5 LEAF_TARGETS verified (5 tar.gz + 5 zip), windows/arm64 excluded"

      - name: Verify checksums and minisign
        run: |
          set -e
          ls -lh dist/checksums.txt dist/checksums.txt.minisig
          echo "--- sha256sum -c ---"
          (cd dist && sha256sum -c checksums.txt)
          echo "--- minisign verify (throwaway key) ---"
          minisign -Vm dist/checksums.txt -p /tmp/minisign.pub -x dist/checksums.txt.minisig
          echo "Smoke minisign verification passed"

      - name: Verify BuildVersion
        run: |
          set -e
          bin=$(find dist -type f -name "biggz" | head -n 1)
          echo "Found binary: $bin"
          if [ -z "$bin" ]; then
            archive=$(ls dist/*.tar.gz | head -n 1)
            echo "No binary found, extracting $archive"
            mkdir -p /tmp/biggz-smoke
            tar -xzf "$archive" -C /tmp/biggz-smoke
            bin=$(find /tmp/biggz-smoke -name "biggz*" -type f | head -n 1)
            echo "Extracted binary: $bin"
          fi
          if [ -z "$bin" ]; then
            echo "::error::Could not locate biggz binary"
            exit 1
          fi
          chmod +x "$bin" || true
          echo "Running $bin --version"
          "$bin" --version
          ver=$("$bin" --version)
          echo "Version output: $ver"
          if [ -z "$ver" ]; then
            echo "::error::--version output empty"
            exit 1
          fi
          echo "BuildVersion check passed"
