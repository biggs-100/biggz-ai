name: Bug Report
description: File a bug report
labels: [type:bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Exact commands or steps to reproduce the issue.
      placeholder: |
        1. Run `biggz doctor`
        2. See error...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `biggz version` or `biggz doctor`
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS version (Windows 11, macOS 15, Ubuntu 24.04, etc.)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Please copy and paste any relevant output. This will be automatically formatted.
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
