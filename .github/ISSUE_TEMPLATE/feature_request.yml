name: Feature Request
description: Suggest an idea for biggz-ai
labels: [type:feature]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe what you'd like to see added.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should this feature work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What alternatives have you considered?

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of biggz-ai does this affect?
      options:
        - CLI
        - TUI
        - MCP Server
        - BigMem
        - SDD Workflow
        - Review System
        - Install
        - Documentation
        - Other
    validations:
      required: true
